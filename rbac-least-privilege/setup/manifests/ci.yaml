apiVersion: v1
kind: Namespace
metadata: {name: ci}
---
apiVersion: v1
kind: Namespace
metadata: {name: apps}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-deployer, namespace: ci}
---
# "It did not work, so we gave it admin."
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ci-deployer-admin}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects:
  - {kind: ServiceAccount, name: ci-deployer, namespace: ci}
---
apiVersion: v1
kind: Secret
metadata: {name: database, namespace: apps}
stringData: {password: s3cr3t-db-password}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: apps}
spec:
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: docker.io/library/busybox:1.37
          command: [sh, -c, "mkdir -p /www && echo web > /www/index.html && exec httpd -f -p 8080 -h /www"]
