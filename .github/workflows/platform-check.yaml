name: platform-check

# Diagnostic: installs the platform on fresh runners of each Ubuntu LTS and
# checks that every component comes up (scripts/release.sh cluster and
# platform). Push a branch platform-check/<anything> to run it. Failures are
# annotated with the state of every pod of the platform.

on:
  push:
    branches: ["platform-check/*"]

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BROKELABS_CLI_VERSION: v0.5.0
      CHART: brokelabs-charts/brokelabs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Sigeth/brokelabs-charts
          ref: v0.5.0
          path: brokelabs-charts
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Install the BrokeLabs CLI
        run: go install "github.com/Sigeth/brokelabs-cli/cmd/brokelabs@$BROKELABS_CLI_VERSION"
      - name: Install Dagger
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start a cluster with the platform
        run: make test-cluster
      - name: Check the whole platform
        continue-on-error: true
        run: make test-platform
      - name: Run a VM challenge
        run: make release-test CHALLENGE=ssh-hardening
