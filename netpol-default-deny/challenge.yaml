# yaml-language-server: $schema=https://raw.githubusercontent.com/Sigeth/brokelabs-core-go/main/schema/challenge-package.schema.json
apiVersion: brokelabs.io/v1alpha1
kind: ChallengePackage
metadata:
  name: netpol-default-deny
  version: 0.1.0
spec:
  title: Default-deny network policies
  summary: In the shop namespace every pod talks to every other, the database included. Deny traffic by default and allow only the paths the application uses.
  category: kubernetes
  difficulty: medium
  estimatedTime: 25m
  tags: [networkpolicy, isolation, cka]
  authors:
    - name: BrokeLabs
      url: https://github.com/Sigeth
  license: MIT

  machines:
    - name: cluster
      runtime: vcluster
      kubernetes: "1.36"
      seed: [setup/manifests]
    - name: workstation
      runtime: pod
      # brokelabs-images Kubernetes workstation: kubectl, helm, jq, yq.
      image: ghcr.io/sigeth/brokelabs-images/workstation-k8s:1.0.0
      kubeconfigFor: cluster

  access:
    terminals:
      - {machine: workstation, label: workstation}

  # Traffic is tested from inside the pods (kubectl exec does not go through
  # the network). Refused paths use pod IPs, so that a DNS failure does not
  # pass for a policy; the guards prove the targets are up.
  tasks:
    - id: default-deny
      title: A policy denies all ingress traffic in shop by default
      points: 10
      hints:
        - {text: "An empty podSelector selects every pod of the namespace; a policy with no ingress rule allows nothing in.", cost: 3}
      check:
        machine: cluster
        kubeCEL:
          resource: {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, namespace: shop}
          any: >-
            size(object.spec.podSelector.?matchLabels.orValue({})) == 0 &&
            size(object.spec.podSelector.?matchExpressions.orValue([])) == 0 &&
            'Ingress' in object.spec.?policyTypes.orValue(['Ingress']) &&
            size(object.spec.?ingress.orValue([])) == 0
    - id: db-only-from-api
      title: The frontend cannot reach the database
      points: 10
      hints:
        - {text: "Allow the database's port from pods labelled app=api only. Policies here must name their peers with pod selectors.", cost: 3}
      check:
        machine: workstation
        shell:
          run: >-
            db=$(kubectl -n shop get pod -l app=db -o jsonpath='{.items[0].status.podIP}') && [ -n "$db" ] &&
            kubectl -n shop exec deploy/frontend -- true &&
            ! kubectl -n shop exec deploy/frontend -- wget -qO- -T3 "http://$db:5432/" >/dev/null 2>&1
    - id: api-only-from-frontend
      title: The database cannot reach the api
      points: 5
      check:
        machine: workstation
        shell:
          run: >-
            api=$(kubectl -n shop get pod -l app=api -o jsonpath='{.items[0].status.podIP}') && [ -n "$api" ] &&
            kubectl -n shop exec deploy/db -- true &&
            ! kubectl -n shop exec deploy/db -- wget -qO- -T3 "http://$api:8080/" >/dev/null 2>&1
    - id: frontend-to-api
      title: The frontend still reaches the api
      points: 0
      guard: true
      check:
        machine: workstation
        shell:
          run: kubectl -n shop exec deploy/frontend -- wget -qO- -T5 http://api:8080/
          expectOutput: shop-api
    - id: api-to-db
      title: The api still reaches the database
      points: 0
      guard: true
      check:
        machine: workstation
        shell:
          run: kubectl -n shop exec deploy/api -- wget -qO- -T5 http://db:5432/
          expectOutput: shop-db
